# 本地开发依赖编排
# 沙箱镜像（docker/sandbox-*.Dockerfile）单独构建，不在此编排内。
services:
  redis:
    image: redis:7-alpine
    ports:
      # 宿主 6379 被其他项目占用，默认改挂 6380；可用 REDIS_HOST_PORT 覆盖
      - "${REDIS_HOST_PORT:-6380}:6379"
    # TODO: 持久化卷、密码等，需与 src/config.ts 中的 REDIS_URL 对齐
    volumes:
      - redis-data:/data

  # TODO(阶段二): 如需容器化部署 API / Worker 进程，在此补充 service

volumes:
  redis-data:
